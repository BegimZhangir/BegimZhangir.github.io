{% assign page_description = page.description | default: site.description %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0c0b">
<title>{% if page.title and page.url != "/" %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page_description | escape }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.title | escape }}">
<meta property="og:description" content="{{ page_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="preload" href="{{ '/assets/fonts/archivo.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M0 0H24V18L18 24H0Z' fill='%23c6ff1a'/%3E%3Cpath d='M6 7H17L7 17H18' fill='none' stroke='%230b0c0b' stroke-width='2.6' stroke-linejoin='bevel'/%3E%3C/svg%3E">
{% capture site_css %}{% include style.scss %}{% endcapture %}
<style>{{ site_css | scssify }}</style>
