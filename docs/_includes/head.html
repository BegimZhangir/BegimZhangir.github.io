{% assign page_description = page.description | default: site.description %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ page_description | escape }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.title | escape }}">
<meta property="og:description" content="{{ page_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4f9a'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Palatino Linotype,Palatino,Georgia,serif' font-size='24' fill='%23fbfaf6'%3EZ%3C/text%3E%3C/svg%3E">
{% capture site_css %}{% include style.scss %}{% endcapture %}
<style>{{ site_css | scssify }}</style>
