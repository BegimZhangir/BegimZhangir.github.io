<header class="topbar">
  <div class="topbar-left">
    <a class="brand" href="{{ '/' | relative_url }}">Begim.net</a>
    {% if site.data.navigation %}
    <nav aria-label="Sections">
      <ul class="topnav">
        {% for item in site.data.navigation %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
    {% endif %}
  </div>
  <p class="docref">
    <span>Doc. no. {{ page.doc | default: "ZB-001" }}</span>
    <span>Rev. <a href="{{ '/revisions/' | relative_url }}">{{ current_rev.rev }}</a></span>
  </p>
</header>
