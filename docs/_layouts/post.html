---
layout: default
---

<header class="post-header">
  <p class="post-kicker">{{ page.categories | first | default: "Blog" }}</p>
  <h1>{{ page.title | escape }}</h1>
  <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%e %B, %Y" }}</time></p>
</header>

<div class="post-body">
  {{ content }}
</div>

<footer class="post-footer">
  <p><strong>Filed under:</strong>
    {% for category in page.categories %}
      <a href="{{ '/blog/#' | append: category | relative_url }}">{{ category }}</a>{% unless forloop.last %}, {% endunless %}
    {% endfor %}
  </p>
  <p><a href="{{ '/blog/' | relative_url }}">← Back to the blog</a></p>
</footer>
