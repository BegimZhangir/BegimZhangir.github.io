title: Zhangir Begim
email: zhanrocks@gmail.com
instagram_username: zhanrocks
youtube_handle: zhanrocks
description: "Zhangir Begim, Mechanical Engineering student at The Hong Kong Polytechnic University."
lang: en
# Dates (post dates, "now" at build time) are in the author's local time, so a post
# dated today is published even while it is still yesterday in UTC.
timezone: Asia/Hong_Kong
baseurl: ""
url: "https://begim.net"
repository: BegimZhangir/BegimZhangir.github.io

author:
  name: Zhangir Begim
  email: zhanrocks@gmail.com
  uri: https://begim.net/

# Blog posts live in _posts/ (YYYY-MM-DD-slug.html) and are served at /blog/slug/
permalink: /blog/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      sheet: Blog

sass:
  style: compressed

theme: null

plugins:
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
